[build]
  publish = "."

[[redirects]]
  from = "/booking"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/maintenance"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
